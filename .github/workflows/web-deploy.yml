name: Web Deploy (GitHub Pages)

# Builds the React app in frontend/ and publishes it to GitHub Pages on every main merge.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Post-process dist for GitHub Pages
        run: |
          touch dist/.nojekyll
          # Custom domain: set the WEB_DOMAIN repo variable once the DNS CNAME exists.
          if [ -n "${{ vars.WEB_DOMAIN }}" ]; then echo "${{ vars.WEB_DOMAIN }}" > dist/CNAME; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
