# Base config — shared across profiles. Secrets come from env vars (never commit real values).
spring.application.name=swadesi-backend
server.port=${SERVER_PORT:8080}

# --- Datasource (Supabase Postgres) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}

# --- JPA / Hibernate ---
# Hibernate NEVER writes DDL; Flyway owns the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# --- JWT ---
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:1440}
app.jwt.issuer=swadesi

# --- Phone-OTP login ---
app.otp.code-length=${OTP_CODE_LENGTH:6}
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.request-cooldown-seconds=${OTP_REQUEST_COOLDOWN_SECONDS:30}
app.otp.max-requests-per-hour=${OTP_MAX_REQUESTS_PER_HOUR:5}
app.otp.max-failed-attempts=${OTP_MAX_FAILED_ATTEMPTS:5}
# Test/QA accounts: these phones skip WhatsApp and log in with the fixed code below.
# Off unless both are set and the code is >= 6 chars (fails closed).
app.otp.test-phones=${OTP_TEST_PHONES:}
app.otp.test-code=${OTP_TEST_CODE:}

# --- WhatsApp (self-hosted WA-AKG gateway, same box). Blank = dry-run (logs, never fails). ---
app.whatsapp.gateway-url=${WHATSAPP_GATEWAY_URL:}
app.whatsapp.gateway-token=${WHATSAPP_GATEWAY_TOKEN:}
app.whatsapp.sender-session-name=${WHATSAPP_SENDER_SESSION_NAME:Swadesi}

# --- Vicinity (meters): listings are visible/orderable only within this radius ---
swadesi.vicinity.radius-meters=${VICINITY_RADIUS_METERS:500}

# --- Razorpay (payments). Blank = payments off; orders go through without charging. ---
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
# Webhook signing secret (Razorpay dashboard -> Settings -> Webhooks). Blank = webhook refuses (503).
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# --- Uploads (dish photos) ---
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# Web addresses allowed to call this API from a browser (comma separated).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Surface ResponseStatusException reasons in the JSON body so the web app can show them
# (e.g. "Wrong pickup code", "Not enough servings left") instead of a generic error.
server.error.include-message=always

# --- Web Push (VAPID). Blank keys = push disabled (app still works). ---
swadesi.push.vapid.public-key=${VAPID_PUBLIC_KEY:}
swadesi.push.vapid.private-key=${VAPID_PRIVATE_KEY:}
swadesi.push.vapid.subject=${VAPID_SUBJECT:mailto:hello@swaadesi.org}

# --- Actuator (health check for the deploy pipeline) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
